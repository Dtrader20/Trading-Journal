name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Extraer proyecto si se subió como zip
        run: |
          if [ -f diario-trading-android.zip ]; then
            unzip -o diario-trading-android.zip
            rm diario-trading-android.zip
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar la app
        run: gradle assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: DiarioTrading-APK
          path: app/build/outputs/apk/debug/app-debug.apk
